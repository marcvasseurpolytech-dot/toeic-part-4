<style>
  :root {
    --navy:#0d1b2a; --navy2:#162840; --gold:#c8993a; --gold-l:#e8b84b;

  }
  body { font-family: 'Source Serif 4', serif; background: var(--cream); color: var(--text); padding: 40px 20px; }
  .container { max-width: 900px; margin: 0 auto; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 40px; }
  a.card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 25px; text-decoration: none; color: inherit; transition: 0.3s; display: block; }
  a.card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
  .card-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--navy); margin-bottom: 10px; }
  .badge { background: #d1fae5; color: #1a7a4a; padding: 3px 10px; border-radius: 99px; font-size: 0.7rem; text-transform: uppercase; }
</style>
</head>
<body>

<div class="container">
